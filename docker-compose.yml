services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobscout}
      POSTGRES_USER: ${POSTGRES_USER:-jobscout}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jobscout_local}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-jobscout}:${POSTGRES_PASSWORD:-jobscout_local}@db:5432/${POSTGRES_DB:-jobscout}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_CANDIDATE_ID: ${JOBSCATTER_CANDIDATE_ID:-32f7bcbf-2e87-4b9b-8847-beb47d4defdf}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      NEXT_PUBLIC_CANDIDATE_ID: ${JOBSCATTER_CANDIDATE_ID:-32f7bcbf-2e87-4b9b-8847-beb47d4defdf}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend

  n8n:
    image: n8nio/n8n:latest
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "false"
      JOBSCATTER_CANDIDATE_ID: ${JOBSCATTER_CANDIDATE_ID:-}
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:5678/
      N8N_SECURE_COOKIE: "false"
      N8N_DIAGNOSTICS_ENABLED: "false"
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  n8n_data:
